version: 2
updates:
  # npm packages: weekly, with minor and patch updates grouped into one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions of the build tools change how the project compiles,
    # so they're upgraded by hand after checking Next.js supports them.
    # @types/node tracks the Node.js version Vercel runs, not the newest.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  # The versions of GitHub's own actions used in CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
